name: Daily library sync

on:
    schedule:
        # 22:30 UTC = 00:30 in Madrid during summer time.
        - cron: "30 22 * * *"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: daily-library-sync
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Update jjlmoya packages
              run: npm run update

            - name: Detect dependency changes
              id: changes
              shell: bash
              run: |
                  if git diff --quiet -- package.json package-lock.json; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "No se han actualizado librerías; no se genera ni se publica nada."
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      echo "Hay cambios de librerías; se generará el sitio."
                  fi

            - name: Generate site and indexes
              if: steps.changes.outputs.changed == 'true'
              run: npm run build

            - name: Commit synchronization
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  git commit --no-verify -m "chore: sync jjlmoya packages"

            - name: Push synchronization
              if: steps.changes.outputs.changed == 'true'
              run: git push
